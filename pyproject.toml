[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-downloader"
version = "3.1.1"
description = "JableTV, MissAV, SupJav and Hanime1 downloader with unattended automation and local AI subtitles"
readme = "README.en.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ALOS", email = "alos21750@users.noreply.github.com" }]
keywords = [
  "jabletv",
  "missav",
  "supjav",
  "hanime1",
  "video-downloader",
  "av-downloader",
  "jav-downloader",
  "automatic-downloader",
  "unattended-downloader",
  "ai-subtitles",
  "docker",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/Alos21750/UAV-Downloader"
Releases = "https://github.com/Alos21750/UAV-Downloader/releases"
Issues = "https://github.com/Alos21750/UAV-Downloader/issues"

[project.scripts]
uav = "uav_downloader.cli.main:main"
uav-downloader = "uav_downloader.cli.main:main"
uav-downloader-cli = "uav_downloader.cli.headless:main"

[project.gui-scripts]
uav-browser = "uav_downloader.entrypoints.browse:main"
uav-watcher = "uav_downloader.entrypoints.watch:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
