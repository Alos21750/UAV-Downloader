name: docker-publish

# Builds UAV Downloader CLI and publishes the canonical image plus transition
# aliases so existing NAS deployments keep receiving updates.
on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'pyproject.toml'
      - 'requirements-docker.txt'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
      - 'scripts/docker_runtime_smoke.py'
    tags: ['v*']
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3          # arm64 emulation
      - uses: docker/setup-buildx-action@v3

      - name: Build runtime smoke image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: uav-runtime-smoke:amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Offline container runtime smoke (amd64)
        run: |
          docker run --rm --network none --platform linux/amd64 uav-runtime-smoke:amd64 --help
          docker run --rm --network none --platform linux/amd64 \
            --mount type=bind,source="${{ github.workspace }}/scripts/docker_runtime_smoke.py",target=/tmp/uav-smoke.py,readonly \
            --entrypoint python uav-runtime-smoke:amd64 /tmp/uav-smoke.py

      - name: Build runtime smoke image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: uav-runtime-smoke:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Offline container runtime smoke (arm64)
        run: |
          docker run --rm --network none --platform linux/arm64 uav-runtime-smoke:arm64 --help
          docker run --rm --network none --platform linux/arm64 \
            --mount type=bind,source="${{ github.workspace }}/scripts/docker_runtime_smoke.py",target=/tmp/uav-smoke.py,readonly \
            --entrypoint python uav-runtime-smoke:arm64 /tmp/uav-smoke.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/uav-downloader
            ghcr.io/${{ github.repository_owner }}/alos-unified-av-downloader
            ghcr.io/${{ github.repository_owner }}/jabletv
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
