# NAS-friendly compose. Put URLs (one per line) in ./downloads/urls.txt, then:
#   docker compose run --rm uav               # downloads everything in urls.txt
#   docker compose run --rm uav <URL> [<URL>] # or pass URL(s) directly
# Videos land in ./downloads on the host.
services:
  uav:
    image: ghcr.io/alos21750/uav-downloader:latest
    # To build locally instead of pulling, comment out `image:` and uncomment:
    # build: .
    container_name: uav-downloader
    volumes:
      - ./downloads:/downloads
    environment:
      - RESOLUTION=highest        # highest | 1080 | 720 | 480
      - MAX_WORKERS_PER_VIDEO=8   # max 1..16; lower to reduce proxy load
      - URLS_FILE=/downloads/urls.txt
    # This is a run-to-completion job, not a long-running service:
    restart: "no"

  # Opt-in only: export a random UAV_WEB_TOKEN, then
  # docker compose --profile web up -d uav-web
  uav-web:
    profiles: [web]
    image: ghcr.io/alos21750/uav-downloader:latest
    container_name: uav-downloader-web
    entrypoint: ["python", "-u", "-m", "uav_downloader.web"]
    ports:
      # Keep loopback-only; use an authenticated TLS reverse proxy or VPN.
      - "127.0.0.1:8765:8765"
    volumes:
      - ./downloads:/downloads
      - uav-web-state:/state
    environment:
      UAV_WEB_HOST: "0.0.0.0"
      UAV_WEB_TOKEN: "${UAV_WEB_TOKEN:-}"
      UAV_WEB_ALLOWED_HOSTS: "${UAV_WEB_ALLOWED_HOSTS:-localhost:8765,127.0.0.1:8765}"
    init: true
    stop_grace_period: 45s
    restart: unless-stopped

volumes:
  uav-web-state:
